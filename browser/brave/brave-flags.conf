# Brave: flagi Mist (Wayland / Hyprland / RTX 4060 + nvidia-vaapi-driver)
# Symlink: ~/.config/brave-flags.conf -> ten plik. /usr/bin/brave czyta go przy starcie.
# Chromium bierze OSTATNIE --enable-features / --disable-features: trzymaj jedną linię każdego.

# Wayland natywnie (bez XWayland), IME text-input-v3
--ozone-platform-hint=auto
--enable-wayland-ime
--wayland-text-input-version=3

# GPU: rasteryzacja + zero-copy na NVIDIA
--enable-gpu-rasterization
--enable-zero-copy
--ignore-gpu-blocklist

# Sprzętowe dekodowanie wideo (NVDEC przez nvidia-vaapi-driver; env LIBVA_DRIVER_NAME=nvidia, NVD_BACKEND=direct)
# Stara nazwa VaapiVideoDecodeLinuxGL nie istnieje w Chromium 157: dekodowanie szło na CPU.
# Bez VaapiIgnoreDriverChecks / AcceleratedVideoDecodeLinuxZeroCopyGL: 2026-11-08 karty padały (renderer SIGILL, "Kurza twarz").
--enable-features=AcceleratedVideoDecodeLinuxGL,VaapiOnNvidiaGPUs,ParallelDownloading,BraveUltraDarkTheme

# Wyłączone: Cast/mDNS skanowanie sieci, podpowiedzi Google (Optimization Guide), wysyłka formularzy do serwera autofill
--disable-features=MediaRouter,DialMediaRouteProvider,OptimizationHints,OptimizationGuideModelDownloading,AutofillServerCommunication,InterestFeedContentSuggestions

# Pionowe karty jak Zen: rozwinięcie po najechaniu (ms)
--vertical-tab-expand-delay=120
--vertical-tab-collapse-delay=220

--enable-smooth-scrolling

# Bez --disk-cache-dir na tmpfs: 2026-11-08 powodował SIGILL renderera ("Kurza twarz") na google.com.
--dark-mode=dark

# Prywatność: bez crash-raportów, domain reliability, hyperlink ping
--disable-breakpad
--disable-domain-reliability
--no-pings
--no-default-browser-check
