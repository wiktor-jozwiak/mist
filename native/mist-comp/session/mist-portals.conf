# ~/.config/xdg-desktop-portal/mist-portals.conf (XDG_CURRENT_DESKTOP=mist)
# xdph does screenshots / screen sharing through wlr-screencopy, which mist-comp implements; the rest is GTK.
[preferred]
default=gtk
org.freedesktop.impl.portal.Screenshot=hyprland
org.freedesktop.impl.portal.ScreenCast=hyprland
org.freedesktop.impl.portal.Secret=gnome-keyring
