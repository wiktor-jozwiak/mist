# ~/.config/xdg-desktop-portal/mist-portals.conf (XDG_CURRENT_DESKTOP=mist), copied there by start-mist.
# xdph does screenshots / screen sharing through wlr-screencopy (whole outputs) and hyprland-toplevel-export
# (single windows), which mist-comp implements; "Open…" / "Save…" are Mist Files windows; the rest is GTK.
# Without this file xdg-desktop-portal goes by each backend's UseIn= and finds no ScreenCast for "mist".
[preferred]
default=gtk
org.freedesktop.impl.portal.Screenshot=hyprland
org.freedesktop.impl.portal.ScreenCast=hyprland
org.freedesktop.impl.portal.FileChooser=mist;gtk
org.freedesktop.impl.portal.Secret=gnome-keyring
