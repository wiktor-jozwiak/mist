[package]
name = "mist-comp"
version = "0.2.0"
edition = "2021"
license = "GPL-3.0-only"
publish = false
description = "Mist Wayland compositor (Smithay), replacing Hyprland; started from Smithay's smallvil (MIT)"

[dependencies]
tracing = "0.1"
tracing-subscriber = { version = "0.3.16", features = ["env-filter"] }
bitflags = "2.2.1"
xcursor = "0.3"
serde_json = "1"
# title bars: mist-ui's text.rs (SF Pro via swash) on a tiny-skia pixmap
swash = "0.2"
tiny-skia = { version = "0.11", default-features = false, features = ["std", "simd"] }
libc = "0.2"
# Hyprland protocols Smithay does not have (protocols/*.xml): window capture, global shortcuts
wayland-scanner = "0.31"
wayland-backend = "0.3"

[dependencies.smithay]
version = "0.7.0"
default-features = false
features = ["xwayland", "backend_winit", "backend_drm", "backend_gbm", "backend_udev", "backend_libinput", "backend_session_libseat", "renderer_gl", "wayland_frontend", "desktop"]

# test clients (examples/): tests/t-lockptr.sh, t-watchdog.sh, t-extws.sh
[dev-dependencies]
wayland-client = "0.31"
wayland-protocols = { version = "0.32", features = ["client", "unstable", "staging"] }
