<svg xmlns="http://www.w3.org/2000/svg" width="512" height="512" viewBox="0 0 512 512">
  <defs>
    <linearGradient id="sky" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#140f1c"/>
      <stop offset="0.5" stop-color="#2b1d26"/>
      <stop offset="1" stop-color="#5a3826"/>
    </linearGradient>
    <radialGradient id="sun" cx="0.5" cy="0.95" r="0.65">
      <stop offset="0" stop-color="#f3a35c" stop-opacity="0.85"/>
      <stop offset="0.45" stop-color="#c46a3c" stop-opacity="0.3"/>
      <stop offset="1" stop-color="#c46a3c" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="dune1" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#4a2e22"/>
      <stop offset="1" stop-color="#2a1a15"/>
    </linearGradient>
    <linearGradient id="dune2" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#2c1c17"/>
      <stop offset="1" stop-color="#160e0c"/>
    </linearGradient>
    <linearGradient id="glass" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#ffffff" stop-opacity="0.22"/>
      <stop offset="1" stop-color="#ffffff" stop-opacity="0.06"/>
    </linearGradient>
    <filter id="soft" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="24"/>
    </filter>
  </defs>

  <!-- Background Sky & Sun -->
  <rect width="512" height="512" fill="url(#sky)"/>
  <rect width="512" height="512" fill="url(#sun)"/>

  <!-- Stars -->
  <g fill="#ffffff" opacity="0.6">
    <circle cx="95" cy="90" r="1.4"/>
    <circle cx="160" cy="140" r="1.0"/>
    <circle cx="210" cy="65" r="1.3"/>
    <circle cx="310" cy="55" r="1.1"/>
    <circle cx="365" cy="130" r="1.4"/>
    <circle cx="420" cy="85" r="1.0"/>
    <circle cx="110" cy="180" r="0.9"/>
    <circle cx="410" cy="175" r="1.1"/>
  </g>

  <!-- Sun Glow on Horizon -->
  <ellipse cx="256" cy="460" rx="200" ry="60" fill="#f0a060" opacity="0.4" filter="url(#soft)"/>

  <!-- Dunes -->
  <path d="M 0,335 C 90,305 180,315 256,335 S 420,365 512,325 L 512,512 L 0,512 Z" fill="url(#dune1)"/>
  <path d="M 0,385 C 110,360 210,375 305,395 S 440,405 512,380 L 512,512 L 0,512 Z" fill="url(#dune2)"/>

  <!-- Dynamic Island -->
  <rect x="186" y="80" width="140" height="32" rx="16" fill="#000000" opacity="0.92"/>
  <circle cx="204" cy="96" r="5" fill="#3b82f6"/>
  <rect x="296" y="92" width="3" height="8" rx="1.5" fill="#60a5fa"/>
  <rect x="302" y="89" width="3" height="14" rx="1.5" fill="#60a5fa"/>
  <rect x="308" y="93" width="3" height="6" rx="1.5" fill="#60a5fa"/>

  <!-- Wordmark "Mist" -->
  <text x="256" y="258" text-anchor="middle"
        font-family="SF Pro Display, -apple-system, BlinkMacSystemFont, 'Segoe UI', Inter, Helvetica, Arial, sans-serif"
        font-size="124" font-weight="700" letter-spacing="-3" fill="#f5efe9">Mist</text>

  <!-- The Dock -->
  <rect x="166" y="340" width="180" height="42" rx="14" fill="url(#glass)" stroke="#ffffff" stroke-opacity="0.22" stroke-width="1"/>
  <rect x="178" y="349" width="24" height="24" rx="6" fill="#f5b942"/>
  <rect x="210" y="349" width="24" height="24" rx="6" fill="#e9e3dc"/>
  <rect x="242" y="349" width="24" height="24" rx="6" fill="#e2683c"/>
  <rect x="274" y="349" width="24" height="24" rx="6" fill="#22c55e"/>
  <rect x="310" y="349" width="24" height="24" rx="6" fill="#64748b"/>
</svg>
