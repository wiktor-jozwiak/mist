<svg xmlns="http://www.w3.org/2000/svg" width="820" height="292" viewBox="0 0 820 292">
  <!-- docs/BENCHMARKS.md: idle PSS of the whole shell (bench/measure.sh), MB; bar length = MB x 1.25 -->
  <rect width="820" height="292" rx="16" fill="#16131a"/>
  <g font-family="-apple-system, Segoe UI, Inter, Helvetica, Arial, sans-serif" font-size="14">
    <text x="24" y="34" font-size="15" font-weight="600" fill="#f2ece6">Idle memory, whole shell (PSS)</text>
    <text x="796" y="34" text-anchor="end" fill="#8d8590">Ryzen 7 5700X · RTX 4060 · two monitors</text>

    <text x="24" y="78" fill="#f2ece6" font-weight="600">Mist, mist-ui alone</text>
    <rect x="250" y="64" width="62" height="20" rx="5" fill="#f0a060" opacity="0.45"/>
    <rect x="250" y="64" width="45" height="20" rx="5" fill="#f0a060"/>
    <text x="320" y="79" fill="#f2ece6">36 – 50 MB · no GL context</text>

    <text x="24" y="118" fill="#f2ece6" font-weight="600">Mist, with mist-wall</text>
    <rect x="250" y="104" width="132" height="20" rx="5" fill="#f0a060" opacity="0.45"/>
    <rect x="250" y="104" width="109" height="20" rx="5" fill="#f0a060"/>
    <text x="390" y="119" fill="#f2ece6">87 – 106 MB</text>

    <text x="24" y="158" fill="#c9c1c6">Noctalia v5</text>
    <rect x="250" y="144" width="152" height="20" rx="5" fill="#6b6370"/>
    <text x="410" y="159" fill="#c9c1c6">122 MB</text>

    <text x="24" y="198" fill="#c9c1c6">Empty Quickshell window</text>
    <rect x="250" y="184" width="155" height="20" rx="5" fill="#6b6370"/>
    <text x="413" y="199" fill="#c9c1c6">124 MB</text>

    <text x="24" y="238" fill="#c9c1c6">Mist on Quickshell (QML)</text>
    <rect x="250" y="224" width="535" height="20" rx="5" fill="#4a4450"/>
    <text x="772" y="239" text-anchor="end" fill="#f2ece6">428 MB · 9.5 % CPU</text>

    <text x="24" y="274" font-size="12" fill="#8d8590">Shared pages split between processes. Method and raw output: docs/BENCHMARKS.md</text>
  </g>
