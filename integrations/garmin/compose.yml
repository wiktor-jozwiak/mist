# One-time Garmin Connect login for Mist: `docker compose run --rm garmin-fetch-data`, then `docker compose down -v`.
# garmin-fetch-data (garmin-grafana, BSD-3-Clause) asks for the e-mail, password and 2FA code and stores session
# tokens in ./garminconnect-tokens; mistd reads and refreshes them from then on. It insists on an InfluxDB at
# start, so a throwaway one runs beside it (no port on the host, nothing kept).
# https://github.com/arpanghosh8453/garmin-grafana
services:
  influxdb:
    image: influxdb:1.11
    environment:
      - INFLUXDB_DB=GarminStats
      - INFLUXDB_USER=login
      - INFLUXDB_USER_PASSWORD=login

  garmin-fetch-data:
    image: thisisarpanghosh/garmin-fetch-data:latest
    depends_on: [influxdb]
    volumes:
      - ./garminconnect-tokens:/home/appuser/.garminconnect
    environment:
      - INFLUXDB_HOST=influxdb
      - INFLUXDB_PORT=8086
      - INFLUXDB_USERNAME=login
      - INFLUXDB_PASSWORD=login
      - INFLUXDB_DATABASE=GarminStats
      - GARMINCONNECT_IS_CN=False
